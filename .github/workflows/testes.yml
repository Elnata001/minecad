name: testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e o Chromium
        run: |
          npm init -y >/dev/null
          npm i -D playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Rodar as suítes
        run: ./tests/run.sh
