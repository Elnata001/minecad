function tileComp(p,w,cells,did,rep2){const d=defOf(did);if(!d||!d.cells||!d.cells.length||!cells.length)return cells;

  MY=w.cat==='floor'?'sec':'min1';/* a altura é parâmetro, não desenho: se o módulo for mais alto, entra uma cópia apoiada na base */

  for(let i=0;i<k;i++)a.push(start+i*size);return a};

   return{x,y:c.y,z,m:c.m,fc:c.fc?rotFace(c.fc,rot):undefined,hf:c.hf,ax:c.ax&&q?(c.ax==='x'?'z':c.ax==='z'?'x':c.ax):c.ax,td:c.td?{...c.td,fc:rotFace(c.td.fc,rot)}:undefined}});

/* ---------- do campo de alturas para a TIN: refinamento por erro ---------- */
function tinQuick(V){const out={V,T:[],bbT:[]};
 if(V.length<3)return out;
 for(const tr of delaunay(V.map(v=>[v[0],v[1]]))){const a=V[tr[0]],b=V[tr[1]],c=V[tr[2]],
  cr=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  if(Math.abs(cr)<1e-9)continue;
  out.T.push(tr);out.bbT.push([Math.min(a[0],b[0],c[0]),Math.min(a[1],b[1],c[1]),Math.max(a[0],b[0],c[0]),Math.max(a[1],b[1],c[1])])}
 if(out.T.length){let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;
  for(const b of out.bbT){if(b[0]<x0)x0=b[0];if(b[1]<z0)z0=b[1];if(b[2]>x1)x1=b[2];if(b[3]>z1)z1=b[3]}
  const gs=Math.max(1,Math.sqrt((x1-x0+1)*(z1-z0+1)/out.T.length)*2),
   gw=Math.max(1,Math.ceil((x1-x0)/gs)+1),gh=Math.max(1,Math.ceil((z1-z0)/gs)+1),G=new Array(gw*gh);
  for(let i=0;i<out.bbT.length;i++){const b=out.bbT[i],
   a0=Math.floor((b[0]-x0)/gs),a1=Math.floor((b[2]-x0)/gs),c0=Math.floor((b[1]-z0)/gs),c1=Math.floor((b[3]-z0)/gs);
   for(let a=a0;a<=a1;a++)for(let c=c0;c<=c1;c++){const j=c*gw+a;(G[j]||(G[j]=[])).push(i)}}
  out.gx=x0;out.gz=z0;out.gs=gs;out.gw=gw;out.gh=gh;out.G=G}
 return out}
/* a malha nasce de uma grade grossa e só recebe pontos onde o erro vertical passa da tolerância */
function wDecim(F,tol,cap){const{x0,z0,w,h,g}=F,at=(x,z)=>g[(z-z0)*w+(x-x0)],
 V=[],seen=new Set(),
 push=(x,z)=>{if(x<x0||z<z0||x>=x0+w||z>=z0+h)return false;const y=at(x,z);
  if(!(y===y))return false;const k=x+','+z;if(seen.has(k))return false;
  seen.add(k);V.push([x+.5,z+.5,y]);return true};
 const st=Math.max(4,Math.round(Math.max(w,h)/10));
 for(let z=z0;z<z0+h;z+=st)for(let x=x0;x<x0+w;x+=st)push(x,z);
 for(let x=x0;x<x0+w;x+=st){push(x,z0);push(x,z0+h-1)}
 for(let z=z0;z<z0+h;z+=st){push(x0,z);push(x0+w-1,z)}
 for(const c of [[x0,z0],[x0+w-1,z0],[x0,z0+h-1],[x0+w-1,z0+h-1]])push(c[0],c[1]);
 /* campo grande: o erro é medido numa amostra, e só a última volta varre tudo */
 const big=w*h>30000?2:1;
 let err=1e9,it=0,q=null;
 for(;it<26;it++){q=tinQuick(V);
  const sp2=it>=25||V.length>=cap?1:big,cand=[];err=0;
  for(let z=z0;z<z0+h;z+=sp2)for(let x=x0;x<x0+w;x+=sp2){const y=at(x,z);if(!(y===y))continue;
   const e=tinZ(q,x+.5,z+.5);if(e===null)continue;
   const d=Math.abs(y-e);if(d>err)err=d;
   if(d>tol)cand.push([d,x,z])}
  if(!cand.length||V.length>=cap)break;
  cand.sort((a,b)=>b[0]-a[0]);
  /* os piores primeiro, espaçados entre si para não amontoar tudo num pico só */
  const sep=Math.max(1,Math.round(Math.sqrt(w*h/Math.max(64,cand.length))*.6)),used=new Set();
  const lim=Math.min(cap-V.length,Math.max(24,Math.round(V.length*.7)));let add=0;
  for(const[d,x,z]of cand){if(add>=lim)break;
   const kk=Math.floor((x-x0)/sep)+','+Math.floor((z-z0)/sep);if(used.has(kk))continue;
   used.add(kk);if(push(x,z))add++}
  if(!add)break}
 return{V,err,it:it+1,q}}

function wLayers(hist){let top='grass_block',n=0;

/* Lê a captura e monta exatamente as estruturas do recorte do mundo, para reaproveitar
   o mesmo caminho de criação do terreno. */
function ccParse(txt,nome){
 let d;try{d=JSON.parse(txt)}catch(e){throw new Error('o arquivo não é uma captura válida')}
 if(!d||d.formato!=='mcad-connect/captura')throw new Error('o arquivo não é uma captura do mCAD Connect');
 const w=d.w|0,h=d.h|0,alt=d.alt||[],pal=d.pal||[],blo=d.blo||[];
 if(w<2||h<2||alt.length!==w*h)throw new Error('a captura está incompleta');
 /* o campo de alturas do recorte do mundo usa NaN para "sem chão"; a captura usa null */
 const g=new Float64Array(w*h);
 const hist=new Map();let n=0,zmin=1e9,zmax=-1e9;
 for(let k=0;k<alt.length;k++){const y=alt[k];
  if(y===null||y===undefined){g[k]=NaN;continue}
  g[k]=y;n++;if(y<zmin)zmin=y;if(y>zmax)zmax=y;
  const b=pal[blo[k]];if(b)hist.set(b,(hist.get(b)||0)+1)}
 if(!n)throw new Error('a captura não tem nenhuma coluna com chão');
 const F={x0:d.x0|0,z0:d.z0|0,w,h,g,hist,n,zmin,zmax};
 const cap=4000,D=wDecim(F,+WOPT.tol||1,cap);
 WIMP={name:(d.mundo||nome||'captura').replace(CCEXT,'')};
 WPRE={F,V:D.V,err:D.err,it:D.it,cap:D.V.length>=cap&&D.err>(+WOPT.tol||1)?cap:0,ms:0};
 return F}

/* ===== TOPOGRAFIA — DISCRETIZAÇÃO EM BLOCOS =====
   Uma conversão só, usada pela vista 3D, pelos cortes, pelos quantitativos e pela exportação: o que
   aparece no programa é exatamente o que sai no mundo. A superfície TIN continua intacta — os blocos
   são representação derivada e são refeitos sozinhos a cada alteração da geometria. */
const TQZ=[['near','Mais próximo'],['down','Para baixo'],['up','Para cima']];
const TFILL=[['depth','Profundidade fixa'],['base','Até uma cota inferior']];
const TVW3=[['blocks','Blocos Minecraft'],['tin','Superfície topográfica'],['both','Sobreposição'],['struct','Estrutura de blocos']];
/* composição padrão, e migração das camadas antigas (superficial, intermediária, inferior) */
const tLayers=ty=>{const L=(ty&&ty.ly&&ty.ly.length?ty.ly:TTDEF.ly);
 return L.map(l=>({m:l.m||'stone',t:Math.max(0,Math.round(+l.t||0))}))};
/* material pela profundidade relativa à superfície (0 = bloco de topo); espessura 0 = o resto */
function tMatAt(ly,d){let a=0;
 for(const l of ly){if(!l.t)return l.m;if(d<a+l.t)return l.m;a+=l.t}
 return ly.length?ly[ly.length-1].m:'stone'}
/* altura discretizada por coluna: a célula inteira é amostrada na malha, não um ponto só.
   O resultado depende apenas da geometria, então serve de base para qualquer composição de camadas. */
const TSMP=[[.5,.5],[.17,.17],[.83,.17],[.17,.83],[.83,.83]];
function topoHeights(q,qz){const k='h|'+qz;if(q.__hk===k)return q.__hv;
 const H=new Map();
 if(q.T.length){let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;
  for(const b of q.bbT){if(b[0]<x0)x0=b[0];if(b[1]<z0)z0=b[1];if(b[2]>x1)x1=b[2];if(b[3]>z1)z1=b[3]}
  x0=Math.floor(x0);z0=Math.floor(z0);x1=Math.ceil(x1);z1=Math.ceil(z1);
  if((x1-x0+1)*(z1-z0+1)<=600000)
   for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){
    let s=0,n=0,ctr=false;
    for(let i=0;i<TSMP.length;i++){const y=tinZ(q,x+TSMP[i][0],z+TSMP[i][1]);
     if(y===null)continue;s+=y;n++;if(!i)ctr=true}
    /* a coluna existe quando o centro da célula está sobre a superfície ou a maioria das amostras está */
    if(!n||(!ctr&&n<3))continue;
    const av=s/n;
    H.set(x+','+z,qz==='down'?Math.floor(av+1e-6):qz==='up'?Math.ceil(av-1e-6):Math.round(av))}}
 q.__hk=k;q.__hv=H;return H}
/* os blocos do terreno: topo na cota discretizada e preenchimento abaixo, fechando o degrau do vizinho */
function topoCells(t){const q=tinOf(t,true);if(!q||!q.T.length)return[];
 const ty=tPar(t),qz=(ty.qz||'near'),H=topoHeights(q,qz),ly=tLayers(ty),
  fill=ty.fill==='base'?'base':'depth',by=Math.round(+ty.by||0),
  /* sem profundidade avulsa: o volume vem da soma das espessuras das camadas */
  dp=Math.max(1,ly.reduce((a,l)=>a+l.t,0)),
  key='c|'+qz+'|'+fill+'|'+dp+'|'+by+'|'+JSON.stringify(ly);
 if(q.__ck2===key)return q.__cv2;
 const out=[],NB=[[1,0],[-1,0],[0,1],[0,-1]];
 for(const[k,h0]of H){const i=k.indexOf(','),x=+k.slice(0,i),z=+k.slice(i+1),
  /* a cota do ponto é a face superior do bloco, como nos pisos: o bloco de topo fica abaixo dela */
  yt=h0-1;
  let low=fill==='base'?Math.min(yt,by):yt-dp+1;
  for(const d of NB){const n=H.get((x+d[0])+','+(z+d[1]));if(n!==undefined&&n-1<low)low=n-1}
  for(let y=low;y<=yt;y++)out.push([x,y,z,tMatAt(ly,yt-y),y===yt?1:0])}
 q.__ck2=key;q.__cv2=out;return out}

async function welFile(texto,caminho){try{const o=JSON.parse(texto),q=o&&(o.p||(o.levels&&o.els?o:null));
  if(!q||!Array.isArray(q.levels)||!Array.isArray(q.els))throw 0;

/* ---- projeto em arquivo .mcad: projeto + componentes + materiais + tipos + texturas ---- */
let MCIMP=null;
/* caminho do .mcad deste projeto nesta máquina, quando há aplicativo instalado.
   Fica fora do projeto porque é uma informação do computador, não do desenho. */
let MCPATH='';
const marcarSalvo=c=>{MCPATH=c;LS.s('mc:file:'+P.id,c);
 toast('Salvo em '+c.split(/[\\/]/).pop(),'ok')};
/* Ctrl+S: no aplicativo sobrescreve o arquivo do projeto, e só pergunta onde salvar
   quando ainda não existe um. No navegador não há arquivo, então abre a exportação. */
async function projSave(como){const D=window.mcDesktop;
 if(!D){dlgFile();return}
 const txt=JSON.stringify(mcadBundle(false));
 if(!como&&MCPATH){if(await D.salvarEm(MCPATH,txt)){marcarSalvo(MCPATH);return}
  toast('Não foi possível gravar em '+MCPATH+'. Escolha outro lugar.')}
 const novo=await D.escolherSalvar(fname(P.name),txt);
 if(novo)marcarSalvo(novo)}
function mcadBundle(tex){const b={mcad:1,v:1,ts:Date.now(),app:'mCAD',p:P,lib:LIB};
 if(tex&&PACKN&&Object.keys(PACK).length){const t={};
  for(const id in PACK){const q=PACK[id];t[id]={s:q.s.toDataURL(),t:q.t?q.t.toDataURL():0,b:q.b?q.b.toDataURL():0}}
  b.pack={name:PACKN,tex:t}}
 return b}
/* Gravar um arquivo: o aplicativo de desktop abre a caixa de diálogo nativa, o claude.ai usa a
   capacidade de download e o navegador comum baixa pelo próprio link. Antes só havia o caminho
   do claude.ai, e por isso o schematic e o .zip não saíam nem no aplicativo nem no Pages. */
const b64de=u=>{let r='';const C=0x8000;for(let i=0;i<u.length;i+=C)r+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(r)};
async function dlSave(nome,dados,mime){
 const bin=dados instanceof Uint8Array,D=window.mcDesktop;
 if(D&&D.salvarBinario){const r=await D.salvarBinario(nome,bin?b64de(dados):String(dados),!!bin);
  if(r===null)return{ok:false,cancel:true};return{ok:true,onde:r}}
 const dl=window.claude&&await window.claude.use('downloads');
 if(dl&&dl.save){try{await dl.save({filename:nome,data:bin?new Blob([dados],{type:mime||'application/octet-stream'}):dados});return{ok:true}}
  catch(e){if(e&&e.code==='declined')return{ok:false,cancel:true};throw e}}
 const u=URL.createObjectURL(new Blob([dados],{type:mime||'application/octet-stream'})),a=document.createElement('a');
 a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),3000);return{ok:true}}
async function saveFile(base,ext,data,msg){const kb=Math.round(data.length/1024);
 try{if(window.mcDesktop&&window.mcDesktop.salvarBinario){
   const r=await dlSave(base+'.'+ext,data,'application/json');
   if(r.cancel){msg('Exportação cancelada.');return false}
   msg('“'+base+'.'+ext+'” salvo'+(r.onde?' em '+r.onde:'')+' ('+kb+' KB).');return true}
  const dl=window.claude&&await window.claude.use('downloads');
  if(dl&&dl.save){const nm=base+'.'+ext+'.json';
   try{await dl.save({filename:nm,data});msg('“'+nm+'” salvo ('+kb+' KB).');return true}
   catch(e){if(e&&e.code==='declined'){msg('Exportação cancelada.');return false}
    if(e&&(e.code==='rejected_extension'||e.code==='extension_not_enabled')){await dl.save({filename:base+'.json',data});msg('“'+base+'.json” salvo ('+kb+' KB).');return true}
    throw e}}
  /* fora do claude.ai o navegador baixa direto, com a extensão própria */
  const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');
  a.href=u;a.download=base+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  msg('“'+base+'.'+ext+'” gerado ('+kb+' KB).');return true}
 catch(e){msg('Não foi possível exportar ('+((e&&(e.message||e.code))||'erro')+').');return false}}
const fname=n=>(n||'projeto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'projeto';
async function mcadSave(){const m=$('#fxm'),msg=t=>{if(m)m.textContent=t};msg('Preparando o arquivo…');
 const tx=$('#fxt');await saveFile(fname(P.name),'mcad',JSON.stringify(mcadBundle(tx?tx.checked:false)),msg)}
async function mcadPick(){const inp=$('#fxf'),m=$('#fxm2'),msg=t=>{if(m)m.innerHTML=t};MCIMP=null;
 const f=inp&&inp.files&&inp.files[0];if(!f){msg('Escolha um arquivo .mcad.');return}
 try{const o=JSON.parse(await f.text()),p=o&&(o.p||(o.levels&&o.els?o:null));
  if(!p||!Array.isArray(p.levels)||!Array.isArray(p.els))throw 0;
  MCIMP=o;const lib=o.lib||p.comps||[];
  msg(`<b>${esc(p.name||'Projeto')}</b> · ${p.levels.length} nível(is) · ${p.els.length} elemento(s) · ${((p.types||{}).wall||[]).length} tipo(s) de parede · ${(p.mats||[]).length} material(is) · ${lib.length} componente(s)${o.pack?' · texturas de “'+esc(o.pack.name||'pacote')+'”':''}`
   +'<div class="row"><button data-a="fximp">Abrir este projeto</button></div>')}
 catch(e){msg('Arquivo inválido: não parece um projeto do mCAD.')}}
async function mcadOpen(mesmo){const o=MCIMP;if(!o)return;const p=o.p||o;
 /* no aplicativo o arquivo é o documento: reabrir o mesmo .mcad atualiza o projeto em vez
    de criar uma cópia. Na importação pelo navegador a cópia continua sendo o certo. */
 if(!mesmo&&idx().some(x=>x.id===p.id)){p.id=uid();p.name=(p.name||'Projeto')+' (importado)'}
 for(const d of o.lib||[])if(d&&d.id&&Array.isArray(d.cells)&&!LIB.some(x=>x.id===d.id))LIB.push(d);
 libSave();
 if(o.pack&&o.pack.tex){try{const P2={};
  for(const id in o.pack.tex){const q=o.pack.tex[id],s2=await url2c(q.s);if(!s2)continue;
   P2[id]={s:s2,t:q.t?await url2c(q.t):null,b:q.b?await url2c(q.b):null}}
  PACK=P2;PACKN=o.pack.name||'texturas do projeto';PACKF=null;PACKOLD=false;T3.clear();PAT.clear();ICOC.clear();TXON=true;LS.s('mc:tex','1');packSave()}catch(e){}}
 MCIMP=null;$('#dlg').close();openP(p)}
function dlgFile(){const d=$('#dlg'),tex=PACKN&&Object.keys(PACK).length;

new ResizeObserver(()=>{if(view==='plan')draw2d();else if(view==='3d')draw3d();else if(view==='sec')drawSec();else if(view==='sheet')drawSheet()}).observe($('#vp'));
/* a biblioteca de blocos é registrada depois do primeiro build: recalcula o modelo com ela carregada */
UIREADY=true;libLoad();libAdopt(P);B=build(P);fit();applyTheme();if(window.indexedDB)packLoad();
MCPATH=LS.g('mc:file:'+P.id)||'';
/* abre na tela inicial — a não ser que o programa tenha sido chamado por um clique duplo
   num .mcad, caso em que o projeto entra direto, sem piscar a tela do meio */
/* a ponte pode ser de uma versão anterior à desta página (atualização automática): se faltar
   alguma função dela, a tela inicial abre do mesmo jeito em vez de travar o programa */
if(window.mcDesktop&&typeof window.mcDesktop.pendente==='function')
 try{window.mcDesktop.pendente().then(r=>{r?welFile(r.texto,r.caminho):welOpen()}).catch(()=>welOpen())}catch(e){welOpen()}
else if(window.mcDesktop)welOpen();
else welOpen();
/* ===== APLICATIVO DESKTOP =====
   Dentro do Electron, o menu nativo e o clique duplo num .mcad chegam por esta ponte.
   No navegador o objeto não existe e o bloco inteiro fica inerte. */
(function(){const D=window.mcDesktop;if(!D||typeof D.ao!=='function')return;
 D.ao('abrir-projeto',async()=>{const r=await D.escolherAbrir();if(r)welFile(r.texto,r.caminho)});
 D.ao('abrir-arquivo',d=>{if(d)welFile(d.texto,d.caminho)});
 D.ao('salvar-projeto',()=>projSave(false));
 D.ao('salvar-como',()=>projSave(true));
 D.ao('tela-inicial',()=>welOpen());
 D.ao('desfazer',()=>undo());D.ao('refazer',()=>redo());
})();
</script></body></html>
